    background-position: center;
    filter: blur(18px) brightness(0.75);
    transform: scale(1.1);
    z-index: -2;
  }

  .bg-tint {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 8, 12, 0.25), rgba(10, 8, 12, 0.55));
    z-index: -1;
  }

  .card {
    width: 360px;
    max-width: calc(100vw - 40px);
    padding: 36px 32px 32px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0 0 24px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    padding: 4px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 0;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab svg {
    width: 14px;
    height: 14px;
  }

  #tabLogin.active {
    background: rgba(46, 124, 242, 0.18);
    color: var(--accent-hover);
    border: 1px solid rgba(46, 124, 242, 0.4);
  }

  #tabKey.active {
    background: rgba(46, 124, 242, 0.18);
    color: var(--accent-hover);
    border: 1px solid rgba(46, 124, 242, 0.4);
  }

  .fields {
    transition: opacity 0.08s ease;
    opacity: 1;
  }

  .fields.fade {
    opacity: 0;
  }

  .fields.hidden {
    display: none;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }

  input {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--field-border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input::placeholder {
    color: rgba(245, 242, 239, 0.35);
  }

  input:focus {
    border-color: rgba(46, 124, 242, 0.6);
    background: rgba(255, 255, 255, 0.12);
  }

  .download {
    width: 100%;
    margin-top: 8px;
    padding: 13px 0;
    border-radius: 10px;
    border: 1px solid rgba(46, 124, 242, 0.55);
    background: rgba(46, 124, 242, 0.16);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .download:hover {
    background: rgba(46, 124, 242, 0.3);
  }

  .download:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-tint"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="card">
    <h1>Loader</h1>

    <div class="tabs">
      <button class="tab active" type="button" id="tabLogin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        Login
      </button>
      <button class="tab" type="button" id="tabKey">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M20 3h-4M20 3v4"/></svg>
        Key
      </button>
    </div>

    <div class="fields" id="loginFields">
      <div class="field">
        <label for="login">Login</label>
        <input id="login" type="text" placeholder="">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="">
      </div>
    </div>

    <div class="fields hidden" id="keyFields">
      <div class="field">
        <label for="key">Key</label>
        <input id="key" type="text" placeholder="">
      </div>
    </div>

    <button class="download" type="button">Download</button>
  </div>

  <script>
    // ---- Rain background effect ----
    (function () {
      const canvas = document.getElementById('rainCanvas');
      const ctx = canvas.getContext('2d');
      let width, height, drops;

      const DROP_COUNT_PER_1000PX2 = 0.06; // density
      const MAX_SPEED = 14;
      const MIN_SPEED = 7;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const count = Math.floor((width * height) / 10000);
        drops = new Array(count).fill(null).map(createDrop);
      }

      function createDrop() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          len: 10 + Math.random() * 20,
          speed: MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED),
          opacity: 0.15 + Math.random() * 0.35,
          drift: (Math.random() - 0.5) * 1.2
        };
      }

      function step() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(174, 210, 255, 0.6)';
        ctx.lineCap = 'round';

        for (const d of drops) {
          ctx.beginPath();
          ctx.globalAlpha = d.opacity;
          ctx.lineWidth = 1;
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.drift * 2, d.y + d.len);
          ctx.stroke();

          d.x += d.drift;
          d.y += d.speed;

          if (d.y > height) {
            d.y = -d.len;
            d.x = Math.random() * width;
          }
          if (d.x > width) d.x = 0;
          if (d.x < 0) d.x = width;
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(step);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    })();

    const tabLogin = document.getElementById('tabLogin');
    const tabKey = document.getElementById('tabKey');
    const loginFields = document.getElementById('loginFields');
    const keyFields = document.getElementById('keyFields');
    const FADE_MS = 80;

    function switchTo(showEl, hideEl, activeTab, inactiveTab) {
      if (activeTab.classList.contains('active')) return;

      activeTab.classList.add('active');
      inactiveTab.classList.remove('active');

      hideEl.classList.add('fade');
      setTimeout(() => {
        hideEl.classList.add('hidden');
        showEl.classList.remove('hidden');
        // force reflow so the next class change actually transitions
        void showEl.offsetWidth;
        showEl.classList.add('fade');
        requestAnimationFrame(() => {
          showEl.classList.remove('fade');
        });
      }, FADE_MS);
    }

    tabLogin.addEventListener('click', () => {
      switchTo(loginFields, keyFields, tabLogin, tabKey);
    });
    tabKey.addEventListener('click', () => {
      switchTo(keyFields, loginFields, tabKey, tabLogin);
    });
  </script>
</body>
</html>
